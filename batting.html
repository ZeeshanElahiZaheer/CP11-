<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batting Stats - CP 11</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="bg-green-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🏏 CP 11</h1>
      <ul class="flex gap-4 md:gap-6 text-sm md:text-base">
        <li><a href="index.html" class="hover:text-yellow-300">Home</a></li>
        <li><a href="batting.html" class="text-yellow-300 font-bold">Batting</a></li>
        <li><a href="bowling.html" class="hover:text-yellow-300">Bowling</a></li>
        <li><a href="fielding.html" class="hover:text-yellow-300">Fielding</a></li>
      </ul>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="bg-green-600 text-white py-10 text-center">
    <h2 class="text-3xl md:text-4xl font-bold">🏏 Batting Statistics</h2>
    <p class="text-green-100 mt-2">CP 11 Team Batting Records</p>
  </header>

  <!-- BATTING TABLE -->
  <section class="max-w-6xl mx-auto px-4 py-10">
    <div class="bg-white rounded-lg shadow-lg overflow-x-auto">
      <table class="w-full text-sm md:text-base">
        <thead class="bg-green-700 text-white">
          <tr>
            <th class="p-3 text-left">#</th>
            <th class="p-3 text-left">Player</th>
            <th class="p-3 text-center">Mat</th>
            <th class="p-3 text-center">Inns</th>
            <th class="p-3 text-center">Runs</th>
            <th class="p-3 text-center">HS</th>
            <th class="p-3 text-center">Avg</th>
            <th class="p-3 text-center">SR</th>
            <th class="p-3 text-center">50s</th>
            <th class="p-3 text-center">100s</th>
          </tr>
        </thead>
        <tbody id="battingTable" class="divide-y divide-gray-200">
          <!-- Data JavaScript se aayega -->
        </tbody>
      </table>
    </div>
    <p class="text-gray-500 text-sm mt-4 text-center">
      <i class="fas fa-info-circle"></i> Stats manually update kiye jaate hain
    </p>
  </section>

  <!-- FOOTER -->
  <footer class="bg-green-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 CP 11 Cricket Team. All Rights Reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
