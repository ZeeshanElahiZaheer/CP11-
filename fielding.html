<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fielding Stats - CP 11</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="bg-green-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🏏 CP 11</h1>
      <ul class="flex gap-4 md:gap-6 text-sm md:text-base">
        <li><a href="index.html" class="hover:text-yellow-300">Home</a></li>
        <li><a href="batting.html" class="hover:text-yellow-300">Batting</a></li>
        <li><a href="bowling.html" class="hover:text-yellow-300">Bowling</a></li>
        <li><a href="fielding.html" class="text-yellow-300 font-bold">Fielding</a></li>
      </ul>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="bg-green-600 text-white py-10 text-center">
    <h2 class="text-3xl md:text-4xl font-bold">🧤 Fielding Statistics</h2>
    <p class="text-green-100 mt-2">CP 11 Team Fielding Records</p>
  </header>

  <!-- TOP FIELDERS CARDS -->
  <section class="max-w-6xl mx-auto px-4 -mt-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow-lg p-6 flex items-center gap-4">
        <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center">
          <i class="fas fa-hand text-2xl text-blue-600"></i>
        </div>
        <div>
          <p class="text-gray-500 text-xs">Most Catches</p>
          <p class="text-lg font-bold text-green-800" id="topCatcher">-</p>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-lg p-6 flex items-center gap-4">
        <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center">
          <i class="fas fa-running text-2xl text-red-600"></i>
        </div>
        <div>
          <p class="text-gray-500 text-xs">Most Run-outs</p>
          <p class="text-lg font-bold text-green-800" id="topRunout">-</p>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-lg p-6 flex items-center gap-4">
        <div class="w-14 h-14 bg-purple-100 rounded-full flex items-center justify-center">
          <i class="fas fa-mitten text-2xl text-purple-600"></i>
        </div>
        <div>
          <p class="text-gray-500 text-xs">Most Stumpings</p>
          <p class="text-lg font-bold text-green-800" id="topStumper">-</p>
        </div>
      </div>
    </div>
  </section>

  <!-- FIELDING TABLE -->
  <section class="max-w-6xl mx-auto px-4 py-10">
    <div class="bg-white rounded-lg shadow-lg overflow-x-auto">
      <table class="w-full text-sm md:text-base">
        <thead class="bg-green-700 text-white">
          <tr>
            <th class="p-3 text-left">#</th>
            <th class="p-3 text-left">Player</th>
            <th class="p-3 text-center">Mat</th>
            <th class="p-3 text-center">Catches</th>
            <th class="p-3 text-center">Run-outs</th>
            <th class="p-3 text-center">Stumpings</th>
            <th class="p-3 text-center">Total</th>
          </tr>
        </thead>
        <tbody id="fieldingTable" class="divide-y divide-gray-200">
          <!-- Data JavaScript se aayega -->
        </tbody>
      </table>
    </div>
    <p class="text-gray-500 text-sm mt-4 text-center">
      <i class="fas fa-info-circle"></i> Stats manually update kiye jaate hain
    </p>
  </section>

  <!-- FOOTER -->
  <footer class="bg-green-800 text-white text-center py-6 mt-12">
    <p>&copy; 2025 CP 11 Cricket Team. All Rights Reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
