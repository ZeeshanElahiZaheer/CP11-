<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP 11 -Cricket Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">

    
    <!--NAVBAR-->
<nav class="bg-green-700 text-white shadow-lg">
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold">🏏 CP11</h1>
   <ul class="flex gap-6 text-sm md:text-base">
    <li><a href="index.html" class="hover:text-yellow-300">Home</a></li>
    <li><a href="batting.html" class="hover:text-yellow-300">Batting</a></li>
    <li><a href="bowling.html" class="hover:text-yellow-300">Bowling</a></li>
    <li><a href="fielding.html" class="hover:text-yellow-300">Fielding</a></li>
   </ul>
 </div>
</nav>


   <!--HERO SECTION-->
   <header class="bg-green-600 text-white py-16 text-center">
     <div class="max-w-4xl mx-auto px-4">
        <div class="w-32 h-32 mx-auto bg-white rounded-full flex items-center justyify-center mb-4 shadow-xl">
          <span class="text-6xl">🏏</span>
        </div>
        <h2 class="text-4xl md:text-5xl font-bold mb-3">CP 11</h2>
        <p class="text-lg md:text-xl text-green-100">Our Team, Our Pride</p>
        </div>
     </header>

      <!--QUICK STATS-->
      <section class="max-w-6xl mx-auto px-4 -mt-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-white rounded-lg shadow p-4 text-center">
            <i class="fas fa-users text-3xl text-green-600 mb-2"></i>
            <p class="text-3xl font-bold text-gray-800">11</p>
            <p class="text-gray-500 text-sm">Players</p>
          </div>
          <div class="bg-white rounded-lg shadow-lg p-6 text-center">
            <i class="fas fa-faseball-ball text-3xl text-green-600 mb-2"></i>
            <p class="text-3xl font-bold text-gray-800">0</p> 
            <p class="text-gray-500 text-sm">Matches</p>
          </div>
          <div class="bg-white rounded-lg shadow-lg p-6 text-center">
            <i class="fas fa-trophy text-3xl text-green-600 mb-2"></i>
            <p class="text-3xl font-bold text-gray-800">0</p>
            <p class="text-gray-500 text-sm">Wins</p>
          </div>
          <div class="bg-white rounded-lg shadow-lg p-6 text-center">
            <i class="fas fa-cricket-bat-ball text-3xl text-green-600 mb-2"></i>
            <p class="text-3xl font-bold text-gray-800">0</p>
            <p class="text-gray-500 text-sm">Runs</p>
          </div>
        </div>
      </section>

      <!-- PLAYERS SECTION -->
       <section class="max-w-6xl mx-auto px-4 py-12">
        <h3 class=""text-3xl font-bold text-center text-gray-800 mb-8">Our squad</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="playersGrid">
          <!-- Players yahan Javascript se aayenge -->
        </div>
       </section>

       <!-- FOOTER -->
        <footer class="bg-green-800 text-white text-center py-6 mt-12">
          <p>&copy; 2026 CP 11 Cricket Team. All rights reserved.</p>
        </footer>

        <script src="js/script.js"></script>
</body>
</html>
